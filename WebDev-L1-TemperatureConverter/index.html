<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="converter">
            <h1>Temperature Converter</h1>
            <p class="subtitle">Convert temperature quickly and easily</p>

            <div class="input-group">
                <label for="temperature">Enter Temperature</label>
                <input type="number" id="temperature" placeholder="Enter value">
            </div>

            <div class="input-group">
                <label for="unit">Convert From</label>
                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button onclick="convertTemperature()">Convert</button>

            <div id="result" class="result">
                Result will appear here
            </div>

            <button class="clear-btn" onclick="clearFields()">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
